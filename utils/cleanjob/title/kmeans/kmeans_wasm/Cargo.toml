[package]
name    = "kmeans_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

ndarray      = { version = "=0.12.1", default-features = false }
once_cell    = "1.19"
getrandom    = { version = "0.2", features = ["js"] }

# **注意：移除了 rkm 和 rand 依赖，使用自定义 k-means 实现**